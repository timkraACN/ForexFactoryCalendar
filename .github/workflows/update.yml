name: ForexFactory Kalender
 
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests curl_cffi beautifulsoup4
      - run: python ff_to_ics.py
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "Kalender aktualisiert" && git push)
 
